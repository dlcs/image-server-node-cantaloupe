name: Build and push Cantaloupe docker image

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  build-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        id: checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: docker-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/dlcs/cantaloupe
          tags: |
            type=ref,event=pr
            type=raw,value=5.0.7,priority=900,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=sha,format=long

      # Build locally first so the processors can be exercised before anything
      # is published - a broken native library returns HTTP 200 with an empty
      # body, so it would otherwise ship unnoticed.
      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          builder: ${{ steps.buildx.outputs.name }}
          tags: dlcs-cantaloupe:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test processors
        run: bash test/smoke-test.sh dlcs-cantaloupe:test

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Cache-hits everything from the test build, so this is just the push.
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          builder: ${{ steps.buildx.outputs.name }}
          tags: ${{ steps.docker-meta.outputs.tags }}
          push: true
          cache-from: type=gha
